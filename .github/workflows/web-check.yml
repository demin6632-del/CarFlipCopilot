name: AUTOFLIP web checks

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-check.yml"
  push:
    branches:
      - "feature/autoflip-web-shell"
    paths:
      - "web/**"
      - ".github/workflows/web-check.yml"

permissions:
  contents: read

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static web smoke tests
        run: node --test web/smoke.test.js web/account-link.test.js
