name: Relay Telegram Bot Check

on:
  push:
    paths:
      - 'relay/**'
      - '.github/workflows/relay-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check relay/server.js
          node --check relay/telegram-bot.js
      - name: Package check
        working-directory: relay
        run: npm install --ignore-scripts
      - name: Autonomous game tests
        working-directory: relay
        run: |
          node --check autonomous-game.js
          node --check autonomous-game.test.js
          node autonomous-game.test.js
      - name: Game dashboard routing guard
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const bot = fs.readFileSync('relay/telegram-bot.js','utf8');
          const game = fs.readFileSync('relay/autonomous-game.js','utf8');
          if (!bot.includes('const autonomousGame = require("./autonomous-game");')) throw new Error('autonomous game module is not wired');
          for (const route of ['text==="/start"','text==="/perekup"','text==="/game"','data.startsWith("ag:")']) {
            if (!bot.includes(route)) throw new Error('missing autonomous route: '+route);
          }
          if (!bot.includes('autonomousGame.init()')) throw new Error('autonomous game init missing');
          if (!bot.includes('q.id')) throw new Error('callback id is not passed for idempotency');
          if (!game.includes('function purchaseListing(state, id)')) throw new Error('purchase flow helper missing');
          if (!game.includes('function repairVehicle(state, id)')) throw new Error('repair flow helper missing');
          if (!game.includes('function prepareVehicle(state, id)')) throw new Error('preparation flow helper missing');
          if (!game.includes('function acceptPendingSale(state, id)')) throw new Error('sale flow helper missing');
          if (!game.includes('function buyPlate(state, id)')) throw new Error('plate buy helper missing');
          if (!game.includes('function sellPlate(state, id)')) throw new Error('plate sell helper missing');
          if (!game.includes('function withState')) throw new Error('transactional state guard missing');
          if (!game.includes('async function withState(chat, firstName, mutate, callbackId)')) throw new Error('callback idempotency guard missing');
          if (!game.includes('if(callbackId && state.processedCallbacks.includes(String(callbackId)))')) throw new Error('duplicate callback check is not transactional');
          if (!game.includes('SELECT state FROM autonomous_game_state WHERE chat_id=$1 FOR UPDATE')) throw new Error('row lock missing');
          console.log('Autonomous game routing and transactional flow guard: OK');
          NODE
          echo "Autonomous game relay guard: OK"
