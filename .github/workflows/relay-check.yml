name: Relay Telegram Bot Check

on:
  push:
    paths:
      - 'relay/**'
      - '.github/workflows/relay-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check relay/server.js
          node --check relay/telegram-bot.js
      - name: Package check
        working-directory: relay
        run: npm install --ignore-scripts
      - name: Game dashboard routing guard
        run: |
          grep -F 'text:"🧠 Стратегия"' relay/telegram-bot.js
          grep -F 'text:"📊 Состояние"' relay/telegram-bot.js
          grep -F 'text:"📜 История"' relay/telegram-bot.js
          grep -F 'text:"💰 Экономика"' relay/telegram-bot.js
          grep -F 'if(text==="🧠 Стратегия") return advice(chat);' relay/telegram-bot.js
          grep -F 'if(text==="📊 Состояние") return state(chat);' relay/telegram-bot.js
          grep -F 'if(text==="🔄 Обновить игру") return renderGame(chat);' relay/telegram-bot.js
          grep -F '{command:"game",description:"Открыть игру в Telegram"}' relay/telegram-bot.js
          grep -F 'gameActionChats.add(String(chat));' relay/telegram-bot.js
          grep -F '[],1200);' relay/telegram-bot.js
          grep -F 'setTimeout(()=>resolve(null),700)' relay/telegram-bot.js
          grep -F 'if(s.vehicle?.hp!=null)lines.push("⚙️ Мощность: "+s.vehicle.hp+" л.с.");' relay/telegram-bot.js
          grep -F 'if(offer!=null)lines.push("💵 Предложение: "+offer.toLocaleString("ru-RU")+" ₽");' relay/telegram-bot.js
          grep -F 'if(contract){' relay/telegram-bot.js
          grep -F 'Учтённая себестоимость:' relay/telegram-bot.js

          grep -F 'for (let attempt=0; attempt<6; attempt++)' relay/user-session-bridge.js
          grep -F 'await new Promise(r=>setTimeout(r,250));' relay/user-session-bridge.js
          grep -F 'recordEconomyTransition(chat,beforeState,target,afterState).catch' relay/telegram-bot.js
          grep -F 'const hasUsableGameScreen=!!(lastGameScreen && (' relay/telegram-bot.js
          grep -F 'const hasScreenText=String(state.raw_message||state.raw_text||"").trim().length>0;' relay/telegram-bot.js
          grep -F 'if(!hasParsedState)return;' relay/telegram-bot.js
          grep -F 'const startedAt=Date.now();' relay/user-session-bridge.js
          grep -F 'Number(this.lastGameMessage.received_at||0)>=startedAt' relay/user-session-bridge.js
