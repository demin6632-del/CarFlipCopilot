name: Relay Telegram Bot Check

on:
  push:
    paths:
      - 'relay/**'
      - '.github/workflows/relay-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autoflip_test
          POSTGRES_USER: autoflip_test
          POSTGRES_PASSWORD: autoflip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoflip_test -d autoflip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check relay/server.js
          node --check relay/telegram-bot.js
      - name: Package and security check
        working-directory: relay
        run: |
          npm install --ignore-scripts
          npm audit --omit=dev
      - name: Autonomous game and marketplace tests
        working-directory: relay
        env:
          TEST_DATABASE_URL: postgres://autoflip_test:autoflip_test@127.0.0.1:5432/autoflip_test
          DATABASE_URL: postgres://autoflip_test:autoflip_test@127.0.0.1:5432/autoflip_test
          DATABASE_SSL: "false"
        run: |
          node --check autonomous-game.js
          node --check autonomous-game.test.js
          node --check player-marketplace-listings.js
          node --check player-marketplace-listings.test.js
          node --check player-marketplace-lock.test.js
          node --check player-marketplace-expiry-worker.js
          node --check player-marketplace-expiry-worker.test.js
          node --check player-marketplace-browse.test.js
          node --check player-marketplace-settlement.js
          node --check player-marketplace-settlement.test.js
          node --check player-marketplace-settlement.postgres.integration.test.js
          node --check player-marketplace-listings.postgres.integration.test.js
          node autonomous-game.test.js
          node player-marketplace-listings.test.js
          node player-marketplace-lock.test.js
          node player-marketplace-expiry-worker.test.js
          node player-marketplace-browse.test.js
          node player-marketplace-settlement.test.js
          node - <<'NODE'
          const fs = require("node:fs");
          const { Client } = require("pg");
          (async () => {
            const client = new Client({ connectionString: process.env.TEST_DATABASE_URL });
            try {
              await client.connect();
              await client.query(fs.readFileSync("vehicle-plate-registry.sql", "utf8"));
              await client.query(fs.readFileSync("player-marketplace-listings.sql", "utf8"));
              await client.query(fs.readFileSync("player-marketplace-settlement.sql", "utf8"));
              console.log("Marketplace PostgreSQL schemas: OK");
            } finally {
              await client.end();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          node player-marketplace-settlement.postgres.integration.test.js
          node player-marketplace-listings.postgres.integration.test.js
      - name: Game dashboard routing guard
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const bot = fs.readFileSync('relay/telegram-bot.js','utf8');
          const game = fs.readFileSync('relay/autonomous-game.js','utf8');
          if (!bot.includes('const autonomousGame = require("./autonomous-game");')) throw new Error('autonomous game module is not wired');
          for (const route of ['command==="/start"','command==="/perekup"','command==="/game"','data.startsWith("ag:")']) {
            if (!bot.includes(route)) throw new Error('missing autonomous route: '+route);
          }
          if (!bot.includes('command==="/start"||command==="/game"||command==="/perekup"')) throw new Error('start commands are not routed to the game');
          if (!bot.includes('"🏦 Банк":"finance"')) throw new Error('bank reply-keyboard route missing');
          if (!game.includes('if(action==="borrow")')) throw new Error('bank loan action missing');
          if (!game.includes('if(action==="rollback")')) throw new Error('odometer action missing');
          if (!bot.includes('autonomousGame.init()')) throw new Error('autonomous game init missing');
          if (!bot.includes('q.id')) throw new Error('callback id is not passed for idempotency');
          if (!game.includes('function purchaseListing(state, id)')) throw new Error('purchase flow helper missing');
          if (!game.includes('function repairVehicle(state, id)')) throw new Error('repair flow helper missing');
          if (!game.includes('function prepareVehicle(state, id)')) throw new Error('preparation flow helper missing');
          if (!game.includes('function acceptPendingSale(state, id)')) throw new Error('sale flow helper missing');
          if (!game.includes('function buyPlate(state, id)')) throw new Error('plate buy helper missing');
          if (!game.includes('function sellPlate(state, id)')) throw new Error('plate sell helper missing');
          if (!game.includes('function containerText(state)')) throw new Error('container terminal missing');
          if (!game.includes('CREATE TABLE IF NOT EXISTS autonomous_container_battles')) throw new Error('container battle storage missing');
          if (!game.includes('async function joinContainerBattle')) throw new Error('container battle join missing');
          if (!game.includes('async function startContainerBattle')) throw new Error('container battle start missing');
          if (!game.includes('players.length<10')) throw new Error('container battle capacity guard missing');
          if (!game.includes('container_battle_prize')) throw new Error('container battle payout missing');
          if (!bot.includes('"⚔️ Сражения":"battle"')) throw new Error('container battle keyboard route missing');
          if (!bot.includes('"🏁 Уличные дуэли":"duel"')) throw new Error('street duel keyboard route missing');
          if (!bot.includes('"🏆 Чемпионат":"championship"')) throw new Error('street duel championship keyboard route missing');
          if (!game.includes('async function streetDuelChampionshipText')) throw new Error('street duel championship query missing');
          if (!game.includes('if(action==="championship")')) throw new Error('street duel championship callback missing');
          if (!game.includes("date_trunc('month',now() AT TIME ZONE 'Europe/Moscow')") || !game.includes("interval '1 month'") || !game.includes("AT TIME ZONE 'Europe/Moscow'")) throw new Error('Moscow-local monthly season boundary missing');
          if (!game.includes('CREATE TABLE IF NOT EXISTS autonomous_street_duels')) throw new Error('street duel storage missing');
          if (!game.includes('async function createStreetDuel')) throw new Error('street duel challenge creation missing');
          if (!game.includes('async function joinStreetDuel')) throw new Error('street duel acceptance missing');
          if (!game.includes('async function cancelStreetDuel')) throw new Error('street duel cancellation/refund missing');
          if (!game.includes('street_duel_prize')) throw new Error('street duel payout missing');
          if (!game.includes('if(action==="duel_join")')) throw new Error('street duel route missing');
          if (!game.includes('const [_,action,id,extra]=String(data).split(":")')) throw new Error('callback action parsing missing');
          if (!game.includes('if(action==="pmarket_view")')) throw new Error('marketplace detail callback missing');
          if (!game.includes('if(action==="crate_open")')) throw new Error('container opening flow missing');
          if (!bot.includes('"📦 Контейнеры":"containers"')) throw new Error('container keyboard route missing');
          if (!game.includes('function marketplaceBrowseScreen')) throw new Error('player marketplace browse screen missing');
          if (!game.includes('action==="pmarket"')) throw new Error('player marketplace browse callback missing');
          if (!bot.includes('"🌐 Общий рынок":"pmarket"')) throw new Error('player marketplace reply-keyboard route missing');
          if (!game.includes('function withState')) throw new Error('transactional state guard missing');
          if (!game.includes('async function withState(chat, firstName, mutate, callbackId)')) throw new Error('callback idempotency guard missing');
          if (!game.includes('if(callbackId && state.processedCallbacks.includes(String(callbackId)))')) throw new Error('duplicate callback check is not transactional');
          if (!game.includes('SELECT state FROM autonomous_game_state WHERE chat_id=$1 FOR UPDATE')) throw new Error('row lock missing');
          console.log('Autonomous game routing and transactional flow guard: OK');
          NODE
          echo "Autonomous game relay guard: OK"
