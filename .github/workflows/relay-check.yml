name: Relay Telegram Bot Check

on:
  push:
    paths:
      - 'relay/**'
      - '.github/workflows/relay-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check relay/server.js
          node --check relay/telegram-bot.js
      - name: Package check
        working-directory: relay
        run: npm install --ignore-scripts
      - name: Game dashboard routing guard
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const bot = fs.readFileSync('relay/telegram-bot.js','utf8');
          const game = fs.readFileSync('relay/autonomous-game.js','utf8');
          if (!bot.includes('const autonomousGame = require("./autonomous-game");')) throw new Error('autonomous game module is not wired');
          for (const route of ['text==="/start"','text==="/perekup"','text==="/game"','data.startsWith("ag:")']) {
            if (!bot.includes(route)) throw new Error('missing autonomous route: '+route);
          }
          if (!bot.includes('autonomousGame.init()')) throw new Error('autonomous game init missing');
          if (!bot.includes('q.id')) throw new Error('callback id is not passed for idempotency');
          if (!game.includes('function purchaseListing(state, id)')) throw new Error('purchase flow helper missing');
          if (!game.includes('function repairVehicle(state, id)')) throw new Error('repair flow helper missing');
          if (!game.includes('function prepareVehicle(state, id)')) throw new Error('preparation flow helper missing');
          if (!game.includes('function acceptPendingSale(state, id)')) throw new Error('sale flow helper missing');
          if (!game.includes('function buyPlate(state, id)')) throw new Error('plate buy helper missing');
          if (!game.includes('function sellPlate(state, id)')) throw new Error('plate sell helper missing');
          if (!game.includes('function withState')) throw new Error('transactional state guard missing');
          if (!game.includes('SELECT state FROM autonomous_game_state WHERE chat_id=$1 FOR UPDATE')) throw new Error('row lock missing');
          console.log('Autonomous game routing and transactional flow guard: OK');
          NODE
          grep -F 'if(text==="🧠 Стратегия") return advice(chat);' relay/telegram-bot.js
          grep -F 'if(text==="📊 Состояние") return state(chat);' relay/telegram-bot.js
          grep -F 'if(text==="🔄 Обновить игру") return renderGame(chat);' relay/telegram-bot.js
          grep -F 'webhookHandler=processUpdate' relay/telegram-bot.js
          grep -F '{command:"game",description:"Открыть игру в Telegram"}' relay/telegram-bot.js
          grep -F 'gameActionChats.add(String(chat));' relay/telegram-bot.js
          grep -F 'const recommended=strategy.actionEvidence ? (ranked[0]?.label||null) : null;' relay/telegram-bot.js
          grep -F 'secret_token:WEBHOOK_SECRET' relay/telegram-bot.js
          grep -F '[],1200);' relay/telegram-bot.js
          grep -F 'setTimeout(()=>resolve(null),700)' relay/telegram-bot.js
          grep -F 'if(s.vehicle?.hp!=null)lines.push("⚙️ Мощность: "+s.vehicle.hp+" л.с.");' relay/telegram-bot.js
          grep -F 'if(offer!=null)lines.push("💵 Предложение: "+offer.toLocaleString("ru-RU")+" ₽");' relay/telegram-bot.js
          grep -F 'if(contract){' relay/telegram-bot.js
          grep -F 'Учтённая себестоимость:' relay/telegram-bot.js

          grep -F 'for (let attempt=0; attempt<6; attempt++)' relay/user-session-bridge.js
          grep -F 'await new Promise(r=>setTimeout(r,250));' relay/user-session-bridge.js
          grep -F 'recordEconomyTransition(chat,beforeState,target,afterState).catch' relay/telegram-bot.js
          grep -F 'const hasUsableGameScreen=!!(lastGameScreen && (' relay/telegram-bot.js
          grep -F 'const hasScreenText=String(state.raw_message||state.raw_text||"").trim().length>0;' relay/telegram-bot.js
          grep -F 'if(!hasParsedState)return;' relay/telegram-bot.js
          grep -F 'const startedAt=Date.now();' relay/user-session-bridge.js
          grep -F 'Number(this.lastGameMessage.received_at||0)>=startedAt' relay/user-session-bridge.js
          grep -F 'Telegram delivery mode: webhook; url:' relay/telegram-bot.js
          grep -F 'Telegram webhook active; getUpdates disabled.' relay/telegram-bot.js
          if grep -Eq 'getUpdates\\s*\\(' relay/telegram-bot.js; then echo 'Unexpected getUpdates call remains'; exit 1; fi
          grep -F 'startGamePolling()' relay/user-session-bridge.js
          grep -F 'getMessages(this.gameUsername,{limit:1})' relay/user-session-bridge.js
          grep -F 'lastPolledGameKey' relay/user-session-bridge.js
          if grep -Fq 'приоритет ' relay/telegram-bot.js; then echo 'Old priority wording remains'; exit 1; fi
          grep -F 'оценка модели ' relay/telegram-bot.js
          grep -F 'slice(0,3900)' relay/telegram-bot.js
