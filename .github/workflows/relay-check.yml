name: Relay Telegram Bot Check

on:
  push:
    paths:
      - 'relay/**'
      - '.github/workflows/relay-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check relay/server.js
          node --check relay/telegram-bot.js
      - name: Package check
        working-directory: relay
        run: npm install --ignore-scripts
