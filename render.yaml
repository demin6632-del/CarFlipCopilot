services:
  - type: web
    name: carflip-copilot-relay
    runtime: node
    rootDir: relay
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: COPILOT_TOKEN
        generateValue: true
        sync: false

  - type: web
    name: carflip-copilot-telegram
    runtime: node
    rootDir: relay
    buildCommand: npm install
    startCommand: npm run start:telegram
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_2FA_PASSWORD
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: RELAY_URL
        fromService:
          name: carflip-copilot-relay
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: COPILOT_TOKEN
        fromService:
          name: carflip-copilot-relay
          type: web
          envVarKey: COPILOT_TOKEN
        sync: false
      - key: GAME_BOT_USERNAME
        value: m0dsbeamngbot
      - key: BRIDGE_PORT
        value: "10000"
